[package]
name = "rsuer"
version = "1.0.0"
description = "Расписание РГЭУ (РИНХ) с локальными уведомлениями"
authors = ["Fresh Milkshake"]
license = "MIT"
keywords = ["schedule", "education", "rsue", "tauri"]
categories = ["education"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "rsuer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tauri-plugin-notification = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
